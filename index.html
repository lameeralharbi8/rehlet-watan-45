/* سؤالان مختلفان لكل حقيقة:
   60 في الرؤية + 60 في وجهة العالم */
function makeRWQuestions(facts){
  const result=[];
  facts.forEach(f=>{
    result.push({
      text:"اختاري الإجابة الصحيحة عن: "+f[0],
      choices:[f[1],f[2],f[3]],
      correct:0
    });
    result.push({
      text:"أي العبارات التالية توضح "+f[0]+"؟",
      choices:[f[2],f[1],f[3]],
      correct:1
    });
  });
  return result;
}

RW.questions1=makeRWQuestions(RW.visionFacts);
RW.questions4=makeRWQuestions(RW.worldFacts);

function chooseRWQuestion(number){
  const bank=number===1?RW.questions1:RW.questions4;
  const storageKey="rw_last_"+number;
  let previous=-1;
  try{
    previous=Number(sessionStorage.getItem(storageKey)??-1);
  }catch(e){}

  let index=Math.floor(Math.random()*bank.length);
  if(index===previous)index=(index+1)%bank.length;

  try{sessionStorage.setItem(storageKey,String(index));}catch(e){}
  RW.currentQuestions[number]=bank[index];
  return bank[index];
}

function renderRWQuestion(number){
  const question=chooseRWQuestion(number);
  const section=document.getElementById("station"+number);
  const box=section.querySelector(".question");
  const title=box.querySelector("h3");
  const answers=box.querySelector(".answers");
  const feedback=document.getElementById("feedback"+number);
  const completeButton=document.getElementById("complete"+number);

  title.textContent="🎯 "+question.text;
  answers.innerHTML="";
  feedback.textContent="";
  completeButton.style.display="none";

  if(number===4)finalQuestionCorrect=false;

  question.choices.forEach((choice,index)=>{
    const button=document.createElement("button");
    button.className="answer";
    button.textContent=choice;

    button.addEventListener("click",()=>{
      if(index===question.correct){
        button.classList.add("correct");
        feedback.textContent="🌟 أحسنتِ! إجابة صحيحة.";
        feedback.style.color="#28764a";

        answers.querySelectorAll("button").forEach(b=>{
          b.disabled=true;
        });

        if(number===1){
          completeButton.style.display="inline-block";
        }else{
          finalQuestionCorrect=true;
          checkFinalStation();
        }
      }else{
        button.classList.add("wrong");
        button.disabled=true;
        feedback.textContent="حاولي مرة ثانية 💚";
        feedback.style.color="#a34d3f";
      }
    });

    answers.appendChild(button);
  });
}

function prepareRWScenarios(){
  RW.solved.clear();
  RW.scenarios=[...RW.scenarioBank]
    .sort(()=>Math.random()-.5)
    .slice(0,4);

  const container=document.querySelector("#station2 .scenarios");
  container.innerHTML="";

  RW.scenarios.forEach((s,index)=>{
    const card=document.createElement("div");
    card.className="scenario";

    const number=document.createElement("span");
    number.className="scenario-number";
    number.textContent=["١","٢","٣","٤"][index];

    const heading=document.createElement("h3");
    heading.textContent=s[0];

    const row=document.createElement("div");
    row.className="choice-row";

    /* ترتيب الخيارين ثابت داخل السؤال */
    [s[1],s[2]].forEach((answer,choiceIndex)=>{
      const button=document.createElement("button");
      button.className="choice";
      button.textContent=answer;

      button.addEventListener("click",()=>{
        if(RW.solved.has(index))return;

        if(choiceIndex===0){
          RW.solved.add(index);
          button.classList.add("good");
          row.querySelectorAll("button").forEach(b=>b.disabled=true);
        }else{
          button.classList.add("bad");
          button.disabled=true;
        }

        const count=RW.solved.size;
        const feedback=document.getElementById("feedback2");

        if(count===4){
          feedback.textContent="🌟 ممتاز! أكملتِ المواقف الأربعة.";
          feedback.style.color="#28764a";
          document.getElementById("complete2").style.display="inline-block";
        }else{
          feedback.textContent="المواقف المكتملة: "+count+" من 4";
        }
      });

      row.appendChild(button);
    });

    card.appendChild(number);
    card.appendChild(heading);
    card.appendChild(row);
    container.appendChild(card);
  });

  document.getElementById("feedback2").textContent="";
  document.getElementById("complete2").style.display="none";
}

const oldRWShowPage=showPage;

showPage=function(id){
  oldRWShowPage(id);
  if(id==="station1"&&!RW.currentQuestions[1]){
    renderRWQuestion(1);
  }
  if(id==="station2"&&!RW.scenarios.length){
    prepareRWScenarios();
  }
  if(id==="station4"&&!RW.currentQuestions[4]){
    renderRWQuestion(4);
  }
};

  RW.currentQuestions={};

  renderRWQuestion(1);
  prepareRWScenarios();
  renderRWQuestion(4);

  /* إعادة إخفاء زر المحطة الرابعة */
